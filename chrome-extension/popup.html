<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    h2 { font-size: 15px; margin: 0; font-weight: 700; color: #f1f5f9; }
    p { font-size: 11px; color: #94a3b8; margin: 2px 0 0 0; }
    
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    /* Radio Mode Cards */
    .mode-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(30, 41, 59, 0.9);
    }
    .mode-card.selected {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
    }
    .mode-card input[type="radio"] {
      margin-top: 3px;
      accent-color: #6366f1;
    }
    .mode-info {
      display: flex;
      flex-direction: column;
    }
    .mode-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
    }
    .mode-desc {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.3;
    }

    /* Action Buttons */
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    
    .btn-submit {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-stop {
      background: #e11d48;
      color: white;
      display: none;
      margin-top: 8px;
    }

    #log {
      margin-top: 12px;
      font-size: 11px;
      color: #34d399;
      line-height: 1.4;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h2>Focus Favorite Collector</h2>
      <p>Social Media Content Sync Tool</p>
    </div>
  </div>

  <div class="section-label">เลือกโหมดการซิงก์ข้อมูล (Select Sync Mode):</div>

  <div class="mode-container">
    <label class="mode-card selected" id="cardNew">
      <input type="radio" name="syncMode" value="new" id="radioNew" checked>
      <div class="mode-info">
        <span class="mode-title">🚀 ดึงเฉพาะข้อมูลใหม่ (Sync New Only)</span>
        <span class="mode-desc">Auto-Scroll ดึงเฉพาะโพสต์ใหม่ที่ยังไม่เคยซิงก์ (เหมาะสำหรับใช้งานประจำวัน)</span>
        <span class="mode-desc" style="color: #fbbf24; margin-top: 4px; font-weight: bold;">⚠️ หากเป็น YouTube ต้องกดจัดเรียง "วันที่เพิ่ม (ล่าสุด)" ก่อนดึงเสมอ!</span>
      </div>
    </label>

    <label class="mode-card" id="cardAll">
      <input type="radio" name="syncMode" value="all" id="radioAll">
      <div class="mode-info">
        <span class="mode-title">🔄 ล้างและดึงใหม่ทั้งหมด (Sync All From Scratch)</span>
        <span class="mode-desc">รีเซ็ตประวัติความจำและ Auto-Scroll กวาดส่งข้อมูลทั้งหมดบนหน้าเพจใหม่จาก 0</span>
      </div>
    </label>
  </div>

  <button id="startSyncBtn" class="btn-submit">⚡ เริ่ม Auto-Scroll & Sync ข้อมูล</button>
  <button id="stopBtn" class="btn-stop">⏹ หยุด Auto-Scroll กลางคัน</button>

  <div id="log"></div>

  <script src="popup.js"></script>
</body>
</html>
